<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharon Zeledón | Inicio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {

            darkMode: 'class',

            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        marca: {
                            gradientStart: '#EC4899',
                            gradientEnd: '#F9A8D4',
                            textoOscuro: '#4A044E',
                            textoClaro: '#C026D3'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-pink-100 dark:bg-slate-900 flex items-center justify-center min-h-screen p-6 font-sans transition-colors duration-500">

    <!-- Botón modo oscuro -->
    <button
        id="theme-toggle"
        class="fixed top-5 right-5 bg-white dark:bg-slate-800 dark:text-white px-4 py-2 rounded-xl shadow-lg hover:scale-105 transition">
        🌙
    </button>

    <!-- Tarjeta Principal -->
    <div class="relative w-full max-w-sm bg-white dark:bg-slate-800 rounded-3xl shadow-xl overflow-hidden transform transition duration-500 hover:scale-105 hover:shadow-2xl">

        <!-- Cabecera -->
        <div class="h-32 bg-gradient-to-r from-marca-gradientStart to-marca-gradientEnd relative">

            <span class="absolute top-4 right-4 bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-emerald-500/30 backdrop-blur-sm">
                Disponible
            </span>

        </div>

        <!-- Avatar -->
        <div class="absolute top-16 left-1/2 transform -translate-x-1/2">

            <div class="w-28 h-28 bg-white p-1.5 rounded-full shadow-lg">

                <div class="w-full h-full rounded-full bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center border border-indigo-200">

                    <img
                        src="img/logoSharon.jpeg"
                        alt="Avatar"
                        class="w-full h-full object-cover rounded-full">

                </div>

            </div>

        </div>

        <!-- Contenido -->
        <div class="pt-20 pb-8 px-8 text-center">

            <h2 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-fuchsia-500 bg-clip-text text-transparent tracking-tight">
                Sharon Zeledon
            </h2>

            <p class="text-sm font-semibold text-marca-textoClaro dark:text-pink-300 mt-1 uppercase tracking-wider">
                Estudiante de Desarrollo Web
            </p>

            <p class="text-slate-500 dark:text-slate-300 text-sm mt-4 leading-relaxed">
                Apasionada por la tecnología, construyendo interfaces hermosas y funcionales usando HTML, CSS, JavaScript y Tailwind CSS.
            </p>

            <!-- Habilidades -->
            <div class="mt-6">

                <h3 class="text-xs font-bold text-slate-400 dark:text-slate-300 uppercase tracking-widest text-left mb-3">
                    Habilidades
                </h3>

                <div class="flex flex-wrap gap-2 justify-start">

                    <span class="px-3 py-1 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-full border border-indigo-100 transition-colors hover:bg-indigo-100 cursor-pointer">
                        HTML5
                    </span>

                    <span class="px-3 py-1 bg-purple-50 text-purple-600 text-xs font-semibold rounded-full border border-purple-100 transition-colors hover:bg-purple-100 cursor-pointer">
                        Tailwind CSS
                    </span>

                    <span class="px-3 py-1 bg-amber-50 text-amber-600 text-xs font-semibold rounded-full border border-amber-100 transition-colors hover:bg-amber-100 cursor-pointer">
                        JavaScript
                    </span>

                    <span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-xs font-semibold rounded-full border border-emerald-100 transition-colors hover:bg-emerald-100 cursor-pointer">
                        Git / GitHub
                    </span>

                </div>
            </div>

            <!-- Botón -->
            <div class="mt-8 flex gap-3">

                <a href="portafolio.html"
                   class="flex-1 px-4 py-2.5 bg-gradient-to-r from-marca-gradientStart to-marca-gradientEnd text-white text-sm font-medium rounded-xl hover:opacity-90 shadow-md shadow-indigo-200 hover:shadow-indigo-300 transition-all text-center">

                    Ver Portafolio

                </a>

            </div>

        </div>
    </div>

    <!-- Script modo oscuro -->
    <script>

        const boton = document.getElementById("theme-toggle");

        if(localStorage.getItem("theme") === "dark"){

            document.documentElement.classList.add("dark");
            boton.textContent = "☀️";

        }

        boton.addEventListener("click", () => {

            document.documentElement.classList.toggle("dark");

            if(document.documentElement.classList.contains("dark")){

                localStorage.setItem("theme", "dark");
                boton.textContent = "☀️";

            }else{

                localStorage.setItem("theme", "light");
                boton.textContent = "🌙";

            }

        });

    </script>

</body>
</html>
